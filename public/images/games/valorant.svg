<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="valBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd3944" />
      <stop offset="50%" stop-color="#53212b" />
      <stop offset="100%" stop-color="#0f1923" />
    </linearGradient>
    <filter id="valGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#valBg)" />
  <!-- Grid overlay -->
  <line x1="100" y1="0" x2="100" y2="800" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <line x1="500" y1="0" x2="500" y2="800" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- Valorant Stylized V Logo -->
  <polygon points="300,280 430,420 380,470 300,380" fill="#fa4454" filter="url(#valGlow)" />
  <polygon points="300,280 170,420 220,470 300,380" fill="#fa4454" filter="url(#valGlow)" />
  <polygon points="300,430 360,500 300,560 240,500" fill="#ece8e1" />
  <!-- Tactical lines -->
  <text x="300" y="650" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="8">VALORANT</text>
  <text x="300" y="690" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="20" fill="#fa4454" letter-spacing="4">TACTICAL 5V5 CHARACTER-BASED FPS</text>
  <rect x="250" y="720" width="100" height="4" fill="#fa4454" />
</svg>

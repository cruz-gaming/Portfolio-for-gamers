<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Cyber Hex Shield -->
  <polygon points="100,10 185,55 185,145 100,190 15,145 15,55" fill="#080b12" stroke="url(#cyberRed)" stroke-width="4" filter="url(#glow)" />
  <polygon points="100,24 170,62 170,138 100,176 30,138 30,62" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  
  <!-- Core Stylized 'C' and Gaming Crosshairs -->
  <path d="M135,70 C125,55 110,48 95,48 C68,48 48,70 48,100 C48,130 68,152 95,152 C112,152 126,144 135,130" fill="none" stroke="url(#cyberRed)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Gaming Crosshair / Sword / Arrow accent -->
  <polygon points="90,100 155,75 140,100 155,125" fill="url(#neonCyan)" />
  <circle cx="100" cy="100" r="6" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Corner Tech accents -->
  <line x1="20" y1="30" x2="45" y2="30" stroke="#00e5ff" stroke-width="2" />
  <line x1="20" y1="30" x2="20" y2="50" stroke="#00e5ff" stroke-width="2" />
  <line x1="180" y1="170" x2="155" y2="170" stroke="#ff1744" stroke-width="2" />
  <line x1="180" y1="170" x2="180" y2="150" stroke="#ff1744" stroke-width="2" />
</svg>

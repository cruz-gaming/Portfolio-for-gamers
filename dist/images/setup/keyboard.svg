<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="kbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="#080b12" />
  <!-- Keyboard chassis -->
  <rect x="60" y="80" width="380" height="190" rx="14" fill="#111827" stroke="#374151" stroke-width="3" />
  <rect x="75" y="95" width="350" height="160" rx="8" fill="#030712" />
  
  <!-- Underglow Bar -->
  <rect x="60" y="260" width="380" height="10" rx="5" fill="url(#kbGlow)" opacity="0.9" />

  <!-- Keys matrix representation -->
  <g fill="#1f2937" stroke="#374151" stroke-width="1.5">
    <!-- Row 1 -->
    <rect x="85" y="105" width="22" height="22" rx="3" fill="#ff1744" />
    <rect x="113" y="105" width="22" height="22" rx="3" />
    <rect x="141" y="105" width="22" height="22" rx="3" />
    <rect x="169" y="105" width="22" height="22" rx="3" />
    <rect x="197" y="105" width="22" height="22" rx="3" />
    <rect x="225" y="105" width="22" height="22" rx="3" />
    <rect x="253" y="105" width="22" height="22" rx="3" />
    <rect x="281" y="105" width="22" height="22" rx="3" />
    <rect x="309" y="105" width="22" height="22" rx="3" />
    <rect x="337" y="105" width="22" height="22" rx="3" />
    <rect x="365" y="105" width="55" height="22" rx="3" />

    <!-- WASD Highlighted Row -->
    <rect x="141" y="133" width="22" height="22" rx="3" fill="#00e5ff" />
    <rect x="127" y="161" width="22" height="22" rx="3" fill="#00e5ff" />
    <rect x="155" y="161" width="22" height="22" rx="3" fill="#00e5ff" />
    <rect x="183" y="161" width="22" height="22" rx="3" fill="#00e5ff" />

    <!-- Spacebar -->
    <rect x="180" y="217" width="140" height="24" rx="4" fill="#374151" stroke="#00e5ff" />
  </g>
</svg>
